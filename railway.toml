# 1) Service Settings → Source → branch: cursor/fix-casino-bot-bugs-93df
# 2) Add Postgres plugin
# 3) Variables → Raw Editor → paste from DEPLOY.md

[build]
builder = "NIXPACKS"
buildCommand = "corepack enable && corepack prepare pnpm@10.33.3 --activate && sed -i 's/minimumReleaseAge: 1440/minimumReleaseAge: 0/' pnpm-workspace.yaml && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build"

[deploy]
startCommand = "pnpm --filter @workspace/db run push && node --enable-source-maps artifacts/api-server/dist/index.mjs"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/health"
healthcheckTimeout = 60
