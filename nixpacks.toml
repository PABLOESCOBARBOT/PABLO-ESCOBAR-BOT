providers = ["node"]

[variables]
CI = "true"
NODE_ENV = "production"

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@10.33.3 --activate",
  "sed -i 's/minimumReleaseAge: 1440/minimumReleaseAge: 0/' pnpm-workspace.yaml || true",
  "pnpm install --frozen-lockfile",
]

[phases.build]
cmds = [
  "pnpm --filter @workspace/api-server run build",
]

[start]
cmd = "node --enable-source-maps artifacts/api-server/dist/index.mjs"
